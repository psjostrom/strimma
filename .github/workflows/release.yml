name: Release APK

on:
  push:
    tags:
      - 'v*'
  # Explicit dispatch from tag-release.yml — required because tags pushed with
  # GITHUB_TOKEN do not trigger other workflows (GitHub anti-recursion).
  # Must be run against a v* tag ref (job guard below); not a branch.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# One release run per tag — queued retries wait; they do not cancel in-flight builds.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch can select any ref; refuse non-v* so we never publish from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          STRIMMA_KEYSTORE_FILE: release.keystore
          STRIMMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STRIMMA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STRIMMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create"
            exit 0
          fi

          VERSION="${TAG#v}"
          APK="strimma-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-rc.* ]] || [[ "$VERSION" == *-beta.* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Extract release notes from the release PR body (between ```markdown fences).
          # Look up the PR by the tagged commit SHA — the tag points to the squash-merge
          # commit on main, which maps to exactly one PR. Title-based search is too loose
          # (e.g. "Release v1.2.0" matches "Release v1.2.0-rc.2").
          PR_DATA=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0] // empty')
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number // empty')
          # Strip CR so fence markers match even when the PR body has CRLF
          # (GitHub/API often stores Windows line endings; ^...$ then fails).
          NOTES=$(echo "$PR_DATA" | jq -r '.body // empty' \
          | tr -d '\r' \
          | sed -n '/^```markdown$/,/^```$/{ /^```/d; p; }')

          # For prereleases, prepend a link to the release PR so the testing-plan
          # checklist (which lives outside the fenced block) is one click away.
          if [ -n "$NOTES" ] && [ -n "$PR_NUMBER" ] && [ -n "$PRERELEASE_FLAG" ]; then
            NOTES=$(printf '**Test plan & verification:** [#%s](https://github.com/%s/pull/%s)\n\n---\n\n%s\n' \
              "$PR_NUMBER" "$REPO" "$PR_NUMBER" "$NOTES")
          fi

          # Always set --title to the tag name. Without it, GitHub leaves name
          # empty and the releases UI synthesizes "tag: PR title" from the
          # squash-merge PR (e.g. "v1.4.0-rc.1: chore(release): ... (#263)").
          # --generate-notes also auto-titles unless --title is passed.
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" \
              "$APK" \
              --title "$TAG" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              "$APK" \
              --title "$TAG" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              $PRERELEASE_FLAG
          fi
