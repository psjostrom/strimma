name: Create release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 1.4.0 or 1.4.0-rc.1). Leave empty to use bump."
        required: false
        type: string
      bump:
        description: "Version bump when version is empty."
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark as release candidate (appends -rc.N)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: create-release-pr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Prepare release
        id: prepare
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_INPUT: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          chmod +x scripts/release.sh
          RC_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            RC_FLAG="--rc"
          fi
          if [ -n "$VERSION_INPUT" ]; then
            scripts/release.sh --prepare --version "$VERSION_INPUT" $RC_FLAG
          else
            scripts/release.sh --prepare --bump "$BUMP_INPUT" $RC_FLAG
          fi

      - name: Create verified commit, branch, and PR
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TITLE: ${{ steps.prepare.outputs.title }}
          BODY_FILE: ${{ steps.prepare.outputs.body_file }}
        with:
          script: |
            const fs = require('fs');
            const { BRANCH, TITLE, BODY_FILE } = process.env;

            const body = fs.readFileSync(BODY_FILE, 'utf8');

            // Read modified files from workspace
            const gradleFile = fs.readFileSync(
              'app/build.gradle.kts', 'utf8'
            );

            // Resolve refs/heads/main explicitly (workflow_dispatch can run from non-main ref)
            const { data: mainRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });

            // Get the base commit from main
            const { data: mainCommit } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: mainRef.object.sha,
            });

            // Create blob for modified file
            const { data: gradleBlob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: gradleFile,
              encoding: 'utf-8',
            });

            // Create a tree with the modified file
            const { data: tree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: mainCommit.tree.sha,
              tree: [
                {
                  path: 'app/build.gradle.kts',
                  mode: '100644',
                  type: 'blob',
                  sha: gradleBlob.sha,
                },
              ],
            });

            // Create commit via the GitHub API (attributed to github-actions bot).
            // API commits show as "Verified" but are not cryptographically signed.
            // Security guarantee: tag-release.yml validates trust boundaries
            // (same repo, release/* branch) before tagging any release.
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: TITLE,
              tree: tree.sha,
              parents: [mainCommit.sha],
            });

            // Create branch (or update if it already exists)
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${BRANCH}`,
                sha: commit.sha,
              });
            } catch (err) {
              if (err.status !== 422) throw err;
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${BRANCH}`,
                sha: commit.sha,
                force: true,
              });
            }

            // Create PR (or update existing)
            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                head: BRANCH,
                base: 'main',
                body: body,
              }));
              console.log(`Created PR #${pr.number}: ${pr.html_url}`);
            } catch (err) {
              if (err.status !== 422) throw err;
              const { data: existing } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${BRANCH}`,
                base: 'main',
                state: 'open',
              });
              if (existing.length === 0) throw err;
              pr = existing[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: TITLE,
                body: body,
              });
              console.log(`Updated existing PR #${pr.number}: ${pr.html_url}`);
            }
